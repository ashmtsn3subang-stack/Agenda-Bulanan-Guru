<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Bulanan Guru</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1d2733;--mu:#667085;--bd:#d6dce5;--pr:#0b6b3a;--ac:#e2b007;--prt:#fff;--in:#fffbe8;--ok:#1a7f4b;--er:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--card:#1d2631;--tx:#e8edf3;--mu:#97a3b3;--bd:#344154;--pr:#4cc38a;--ac:#f2c94c;--prt:#0d1520;--in:#2a2a1c;--ok:#4cc38a;--er:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a22;--card:#1d2631;--tx:#e8edf3;--mu:#97a3b3;--bd:#344154;--pr:#4cc38a;--ac:#f2c94c;--prt:#0d1520;--in:#2a2a1c;--ok:#4cc38a;--er:#ff8a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Arial,Helvetica,sans-serif}
.logo{height:56px;width:auto;max-width:90px;border-radius:8px;background:#fff;padding:3px;object-fit:contain;flex:none;display:block}#lg{display:flex;gap:12px;align-items:center;cursor:pointer}
header{background:var(--pr);color:var(--prt);border-bottom:5px solid var(--ac);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0}header small{opacity:.85}
main{max-width:1100px;margin:0 auto;padding:12px}
nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--mu);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pr);border-color:var(--pr);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px;border-top:3px solid var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.06)}
h2{font-size:15px;margin:0 0 12px;letter-spacing:.3px;color:var(--pr)}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin:16px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:0}
.hb{background:var(--ac);color:#1d2733;border:0;border-radius:5px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:center;margin:22px 0 14px}.sign .sp{height:64px}.sign u{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:5px;padding:6px}
textarea{min-height:56px;resize:vertical}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th{background:var(--pr);color:var(--prt);padding:7px;font-size:12px;text-align:left}
td{padding:4px;border-bottom:1px solid var(--bd);vertical-align:top}
td.c{font-weight:700;white-space:nowrap;padding:8px}
button.b{background:var(--pr);color:var(--prt);border:0;border-radius:5px;padding:7px 12px;font:inherit;cursor:pointer}
button.x{background:none;border:0;color:var(--er);cursor:pointer;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.st{flex:1 1 140px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
.st b{display:block;font-size:20px;color:var(--pr)}.st span{font-size:12px;color:var(--mu)}
.note{color:var(--mu);font-size:12px;margin:6px 0 0}
#stat{font-size:12px}
</style></head><body>
<header><div id="lg" title="Klik untuk mengganti logo sekolah"><span id="logo"></span><div><h1>Agenda Bulanan Guru</h1><small>MTsN 3 Subang · Kementerian Agama RI</small><br><small id="who">Data tersimpan di perangkat ini</small></div></div><input type="file" id="lf" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
<div style="display:flex;gap:10px;align-items:center"><span id="stat"></span>
<button class="hb" data-pdf id="pdfb">⬇ Unduh PDF</button><input type="month" id="bulan" style="width:auto"></div></header>
<main><nav id="nav"></nav><div id="view"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
const TABS=[["kal","1. Kalender & Jadwal"],["tp","2. Target TP"],["jur","3. Jurnal Harian"],["ev","4. Evaluasi"],["non","5. Non-Mengajar"],["ref","6. Refleksi"]];
const HARI=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const SEC={
jadwal:[["kelas","Kelas"],["hari","Hari","s",HARI],["jam","Jam ke-"],["pert","Pertemuan","n"],["jpp","JP/pertemuan","n"],["JP","Jumlah JP","c"]],
tp:[["minggu","Minggu","s",["I","II","III","IV","V"]],["capaian","Capaian/Tujuan Pembelajaran","a"],["materi","Materi Pokok","a"],["target","Target Selesai","d"],["status","Status","s",["Belum","Sebagian","Tercapai"]]],
jur:[["tgl","Tanggal","d"],["kelas","Kelas"],["materi","Materi/Kegiatan KBM","a"],["jml","Siswa","n"],["h","Hadir","n"],["s","Sakit","n"],["i","Izin","n"],["a","Alpa","n"],["pct","% Hadir","c"],["hamb","Hambatan/Kendala","a"]],
ev:[["tgl","Tanggal","d"],["kelas","Kelas"],["jenis","Jenis","s",["Ulangan Harian","Tugas Proyek","Remedial","Pengayaan"]],["materi","Materi","a"],["ket","Keterangan","a"],["st","Status","s",["Terjadwal","Terlaksana","Ditunda"]]],
non:[["tgl","Tanggal","d"],["keg","Kegiatan (Rapat, Supervisi, Ekskul, Hari Besar)","a"],["waktu","Waktu"],["tempat","Tempat"],["cat","Peran/Catatan","a"]]};
const REF=[["efektif","Metode yang efektif"],["kurang","Metode yang kurang efektif"],["siswa","Siswa yang perlu perhatian khusus"],["rencana","Rencana perbaikan bulan depan"]];
let downloads=null,logoId=null,tab="kal",ym="",S=null,libur=[],timer=null,loadTok=0;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const fmtD=(iso,b="………")=>{if(!iso)return b;const[y,m,d]=iso.split("-").map(Number);return d+" "+BLN[m-1]+" "+y};
const todayISO=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
const defTA=()=>{const n=new Date(),s=n.getMonth()>=6?n.getFullYear():n.getFullYear()-1;return s+"/"+(s+1)};
const taList=()=>{const s=+defTA().slice(0,4);return[-1,0,1,2].map(o=>(s+o)+"/"+(s+o+1))};
const MAPEL=["Al-Qur’an Hadis","Akidah Akhlak","Fikih","Sejarah Kebudayaan Islam","Bahasa Arab","Bahasa Indonesia","Bahasa Inggris","Bahasa Sunda","Matematika","IPA","IPS","PPKn","PJOK","Seni Budaya","Informatika","Prakarya","Bimbingan Konseling"];
function idCard(I){
 const sel=(k,l,o)=>{const a=(!I[k]||o.includes(I[k]))?o:[I[k],...o];return`<div><label>${l}</label><select data-id="${k}">${a.map(x=>`<option${x===I[k]?" selected":""}>${esc(x)}</option>`).join("")}</select></div>`};
 const inp=(k,l,t="text",ph="",lst="")=>`<div><label>${l}</label><input data-id="${k}" type="${t}" value="${esc(I[k])}" placeholder="${ph}"${lst?` list="${lst}"`:""}></div>`;
 return`<div class="card"><h2>Identitas</h2><div class="sub" style="margin-top:0">Data guru</div><div class="grid">${inp("nama","Nama Guru","text","Nama lengkap beserta gelar")}${inp("nip","NIP / NUPTK","text","Opsional")}${inp("mapel","Mata Pelajaran","text","Pilih atau ketik","mapelL")}${sel("sem","Semester",["Ganjil","Genap"])}${sel("ta","Tahun Ajaran",taList())}</div>
 <div class="sub">Penandatangan &amp; titimangsa laporan</div><div class="grid">${inp("kepsek","Nama Kepala Madrasah")}${inp("nipk","NIP Kepala Madrasah","text","Opsional")}${inp("tempat","Tempat penandatanganan")}${inp("tgl","Titimangsa (tanggal laporan)","date")}</div>
 <datalist id="mapelL">${MAPEL.map(m=>`<option value="${m}">`).join("")}</datalist></div>`}
const empty=()=>({id:{nama:"",nip:"",mapel:"",sem:"Ganjil",ta:defTA(),kepsek:"",nipk:"",tempat:"Subang",tgl:todayISO()},jadwal:[],tp:[],jur:[],ev:[],non:[],ref:{}});
const num=v=>parseFloat(v)||0;
function setStat(t,bad){$("stat").textContent=t;$("stat").style.color=bad?"var(--er)":"inherit"}
function save(){setStat("Menyimpan…");clearTimeout(timer);timer=setTimeout(()=>{
 try{localStorage.setItem("agenda:"+ym,JSON.stringify(S));setStat("Tersimpan ✓")}catch(e){setStat("Gagal menyimpan",1)}},400)}
function saveLib(){try{localStorage.setItem("agenda:libur",JSON.stringify(libur))}catch(e){setStat("Gagal menyimpan libur",1)}}
function monthDays(){const[y,m]=ym.split("-").map(Number);const n=new Date(y,m,0).getDate(),out=[];
 for(let d=1;d<=n;d++)out.push({d,dow:new Date(y,m-1,d).getDay(),iso:ym+"-"+String(d).padStart(2,"0")});return out}
function calc(){
 const lib=new Set(libur.map(l=>l.tgl)),days=monthDays();
 const ef=days.filter(x=>x.dow>=1&&x.dow<=5&&!lib.has(x.iso)).length;
 const libM=libur.filter(l=>l.tgl&&l.tgl.startsWith(ym)).length;
 const jp=S.jadwal.reduce((a,r)=>a+num(r.pert)*num(r.jpp),0);
 const sj=S.jur.reduce((a,r)=>(a.j+=num(r.jml),a.h+=num(r.h),a.s+=num(r.s),a.i+=num(r.i),a.a+=num(r.a),a),{j:0,h:0,s:0,i:0,a:0});
 const tpOk=S.tp.filter(r=>r.status==="Tercapai").length;
 const set=(k,v)=>document.querySelectorAll('[data-s="'+k+'"]').forEach(e=>e.textContent=v);
 set("ef",ef);set("lib",libM);set("jp",jp);set("jml",S.jur.length);
 set("hadir",sj.j?(sj.h/sj.j*100).toFixed(1)+"%":"–");set("sia",sj.s+" / "+sj.i+" / "+sj.a);
 set("tp",S.tp.length?Math.round(tpOk/S.tp.length*100)+"%":"–");
 ["Ulangan Harian","Tugas Proyek","Remedial","Pengayaan"].forEach(j=>set("ev"+j,S.ev.filter(r=>r.jenis===j).length));
 document.querySelectorAll("[data-c]").forEach(e=>{const[sec,i,k]=e.dataset.c.split(":"),r=S[sec][i];if(!r)return;
  if(k==="JP")e.textContent=num(r.pert)*num(r.jpp);
  if(k==="pct"){const t=num(r.jml);e.textContent=t?(num(r.h)/t*100).toFixed(0)+"%":"";
   const ok=num(r.h)+num(r.s)+num(r.i)+num(r.a)===t;e.style.color=t&&!ok?"var(--er)":"inherit";e.title=t&&!ok?"Jumlah hadir+sakit+izin+alpa tidak sama dengan jumlah siswa":""}})}
function field(sec,i,c,v){const[k,,t,o]=c,a=`data-sec="${sec}" data-i="${i}" data-k="${k}"`;
 if(t==="c")return`<td class="c" data-c="${sec}:${i}:${k}"></td>`;
 if(t==="s")return`<td><select ${a}><option></option>${o.map(x=>`<option${x===v?" selected":""}>${x}</option>`).join("")}</select></td>`;
 if(t==="a")return`<td><textarea ${a}>${esc(v)}</textarea></td>`;
 return`<td><input ${a} type="${t==="d"?"date":t==="n"?"number":"text"}"${t==="n"?' min="0"':""} value="${esc(v)}"></td>`}
function table(sec,label){const cols=SEC[sec];
 return`<div class="tw"><table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}<th></th></tr>${S[sec].map((r,i)=>`<tr>${cols.map(c=>field(sec,i,c,r[c[0]])).join("")}<td><button class="x" data-del="${sec}:${i}" title="Hapus baris">✕</button></td></tr>`).join("")}</table></div>
 <p><button class="b" data-add="${sec}">+ Tambah ${label}</button></p>`}
const st=(k,l)=>`<div class="st"><b data-s="${k}">–</b><span>${l}</span></div>`;
function liburCard(){return`<div class="card"><h2>Hari libur nasional / cuti bersama</h2>
 <p class="note">Daftar ini dipakai untuk menghitung hari efektif dan tersimpan di perangkat ini.</p>
 <div class="tw"><table><tr><th>Tanggal</th><th>Keterangan</th><th></th></tr>${libur.map((l,i)=>`<tr><td><input type="date" data-lib="${i}" data-k="tgl" value="${esc(l.tgl)}"></td><td><input data-lib="${i}" data-k="ket" value="${esc(l.ket)}"></td><td><button class="x" data-dl="${i}">✕</button></td></tr>`).join("")}</table></div>
 <p><button class="b" data-addlib>+ Tambah libur</button></p></div>`}
function render(){
 $("nav").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${l}</button>`).join("");
 const I=S.id,v=$("view");
 if(tab==="kal")v.innerHTML=`${idCard(I)}
 <div class="stats">${st("ef","Hari efektif belajar")}${st("lib","Hari libur bulan ini")}${st("jp","Total JP bulan ini")}</div>
 <div class="card"><h2>Distribusi jam mengajar</h2>${table("jadwal","kelas")}</div>${liburCard()}`;
 if(tab==="tp")v.innerHTML=`<div class="stats">${st("tp","Ketercapaian TP")}</div><div class="card"><h2>Target Capaian Pembelajaran / Materi Pokok</h2>${table("tp","target")}</div>`;
 if(tab==="jur")v.innerHTML=`<div class="stats">${st("jml","Pertemuan tercatat")}${st("hadir","Rata-rata kehadiran")}${st("sia","Sakit / Izin / Alpa")}</div><div class="card"><h2>Rekapitulasi Jurnal Harian</h2>${table("jur","jurnal")}<p class="note">Angka merah pada % Hadir berarti hadir+sakit+izin+alpa belum sama dengan jumlah siswa.</p></div>`;
 if(tab==="ev")v.innerHTML=`<div class="stats">${["Ulangan Harian","Tugas Proyek","Remedial","Pengayaan"].map(j=>st("ev"+j,j)).join("")}</div><div class="card"><h2>Agenda Evaluasi &amp; Penilaian</h2>${table("ev","evaluasi")}</div>`;
 if(tab==="non")v.innerHTML=`<div class="card"><h2>Kegiatan Non-Mengajar / Sekolah</h2>${table("non","kegiatan")}</div>`;
 if(tab==="ref")v.innerHTML=`<div class="card"><h2>Catatan Refleksi &amp; Tindak Lanjut</h2>${REF.map(([k,l])=>`<div style="margin-bottom:10px"><label>${l}</label><textarea data-ref="${k}" style="min-height:80px">${esc(S.ref[k])}</textarea></div>`).join("")}
 <div class="sign"><div>Mengetahui,<br>Kepala Madrasah<div class="sp"></div><u>${esc(I.kepsek)||"………………"}</u><br>NIP. ${esc(I.nipk)||"………"}</div><div>${esc(I.tempat)||"………"}, ${fmtD(I.tgl)}<br>Guru Mata Pelajaran<div class="sp"></div><u>${esc(I.nama)||"………………"}</u><br>NIP. ${esc(I.nip)||"………"}</div></div>
 <button class="b" data-pdf>⬇ Unduh laporan PDF</button></div>`;
 calc()}
/*LOGO_PLACEHOLDER*/const KEMENAG="",LOGO="";/*LOGO_PLACEHOLDER*/
function renderLogo(){const src=logoId||LOGO;$("logo").innerHTML=src?`<img class="logo" alt="Logo MTsN 3 Subang" src="${src}">`:""}
$("lg").addEventListener("click",()=>$("lf").click());
$("lf").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,256/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement("canvas");
  c.width=Math.round(i.naturalWidth*s);c.height=Math.round(i.naturalHeight*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
  logoId=c.toDataURL("image/png");try{localStorage.setItem("agenda:logo",logoId);setStat("Logo diperbarui ✓")}catch(x){setStat("Gagal menyimpan logo",1)}renderLogo()};i.src=r.result};
 r.readAsDataURL(f);e.target.value=""});
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>{try{const c=document.createElement("canvas");c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext("2d").drawImage(i,0,0);r({url:c.toDataURL("image/png"),w:c.width,h:c.height})}catch(e){r(null)}};i.onerror=()=>r(null);i.src=src})}
async function makePDF(){
 const J=window.jspdf&&window.jspdf.jsPDF;if(!J){setStat("Pustaka PDF belum termuat",1);return}
 setStat("Menyiapkan PDF…");
 try{
 const I=S.id,[yy,mm]=ym.split("-").map(Number),W=297,M=14,G=[11,107,58],Y=[226,176,7];
 let img=logoId?await loadImg(logoId):null;if(!img)img=await loadImg(LOGO);
 const doc=new J({orientation:"landscape",unit:"mm",format:"a4"});
 const lg=(im,x0,right)=>{if(!im)return;let h=22,w=h*im.w/im.h;if(w>30){w=30;h=w*im.h/im.w}doc.addImage(im.url,"PNG",right?W-M-w:x0,12+(22-h)/2,w,h)};
 lg(img,M,false);lg(await loadImg(KEMENAG),0,true);
 doc.setTextColor(0).setFont("helvetica","normal").setFontSize(10).text("KEMENTERIAN AGAMA REPUBLIK INDONESIA",W/2,17,{align:"center"});
 doc.setFont("helvetica","bold").setFontSize(15).text("MADRASAH TSANAWIYAH NEGERI 3 SUBANG",W/2,24,{align:"center"});
 doc.setFont("helvetica","normal").setFontSize(9).text("KABUPATEN SUBANG",W/2,29.5,{align:"center"});
 doc.setDrawColor(...G).setLineWidth(.9).line(M,37,W-M,37);doc.setDrawColor(...Y).setLineWidth(.4).line(M,38.4,W-M,38.4);
 doc.setFont("helvetica","bold").setFontSize(12).text("AGENDA BULANAN GURU",W/2,46,{align:"center"});
 doc.setFont("helvetica","normal").setFontSize(10).text("Bulan "+BLN[mm-1]+" "+yy,W/2,51.5,{align:"center"});
 const lib=new Set(libur.map(l=>l.tgl)),ef=monthDays().filter(x=>x.dow>=1&&x.dow<=5&&!lib.has(x.iso)).length;
 const jp=S.jadwal.reduce((a,r)=>a+num(r.pert)*num(r.jpp),0),sj=S.jur.reduce((a,r)=>(a.j+=num(r.jml),a.h+=num(r.h),a),{j:0,h:0});
 const tpOk=S.tp.filter(r=>r.status==="Tercapai").length;
 doc.autoTable({startY:56,theme:"plain",styles:{fontSize:9,cellPadding:.9},margin:{left:M,right:M},columnStyles:{0:{cellWidth:38,fontStyle:"bold"},1:{cellWidth:95},2:{cellWidth:42,fontStyle:"bold"}},
  body:[["Nama Guru",": "+(I.nama||"-"),"Semester",": "+(I.sem||"-")],["NIP / NUPTK",": "+(I.nip||"-"),"Tahun Ajaran",": "+(I.ta||"-")],["Mata Pelajaran",": "+(I.mapel||"-"),"Hari efektif / Total JP",": "+ef+" hari / "+jp+" JP"],["Rata-rata kehadiran",": "+(sj.j?(sj.h/sj.j*100).toFixed(1)+"%":"-"),"Ketercapaian TP",": "+(S.tp.length?Math.round(tpOk/S.tp.length*100)+"%":"-")]]});
 const nz=r=>Object.values(r).some(v=>v),cell=(r,c)=>{const[k,,t]=c;if(t==="c"){if(k==="JP")return num(r.pert)*num(r.jpp);const n=num(r.jml);return n?(num(r.h)/n*100).toFixed(0)+"%":""}return t==="d"?fmtD(r[k],""):(r[k]??"")};
 const rowsOf=(sec,sort)=>{let a=S[sec].filter(nz);if(sort)a=a.slice().sort((x,z)=>(x.tgl||"~").localeCompare(z.tgl||"~"));return a.map(r=>SEC[sec].map(c=>cell(r,c)))};
 const sec=(t,head,rows,sub)=>{let y0=doc.lastAutoTable.finalY+(sub?4:8);if(y0>182){doc.addPage();y0=16}
  doc.setFont("helvetica","bold").setFontSize(sub?9:10.5).setTextColor(...G).text(t,M,y0);doc.setTextColor(0);
  doc.autoTable({startY:y0+2,head:[head],body:rows.length?rows:[[{content:"Belum ada data",colSpan:head.length,styles:{halign:"center",textColor:120}}]],theme:"grid",styles:{fontSize:8,cellPadding:1.6,lineColor:[190,190,190],lineWidth:.15,valign:"top"},headStyles:{fillColor:G,textColor:255},margin:{left:M,right:M}})};

  if(raw)data=JSON.parse(raw);
  else{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^agenda:\d{4}-\d{2}$/.test(k)&&k<"agenda:"+ym)ks.push(k)}
   ks.sort();const lk=ks.pop();
   if(lk){const last=JSON.parse(localStorage.getItem(lk));if(last&&last.id)data=Object.assign(empty(),{id:Object.assign({},last.id,{tgl:todayISO()}),jadwal:last.jadwal||[]})}}}catch(e){}
